<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Simulados & Desempenho</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 24px; }
        header h1 { font-size: 2rem; color: #0f172a; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
        .tab-btn { background: none; border: none; padding: 10px 20px; font-size: 1rem; font-weight: 600; color: var(--text-muted); cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .card { background: var(--card-bg); border-radius: var(--radius); padding: 24px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .question-card { margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .question-title { font-weight: 600; font-size: 1.1rem; margin-bottom: 12px; }
        .options-list { display: flex; flex-direction: column; gap: 8px; }
        .option-item { display: flex; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; }
        .option-item input { margin-right: 12px; }

        select, input[type="text"] { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }

        .btn { background: var(--primary); color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; width: 100%; }
        .btn:hover { background: var(--primary-hover); }
        .btn-sm { background: var(--primary); color: white; border: none; padding: 6px 12px; font-size: 0.85rem; font-weight: 600; border-radius: 6px; cursor: pointer; }
        .btn-sm:hover { background: var(--primary-hover); }

        .feedback { margin-top: 10px; padding: 10px; border-radius: 6px; font-size: 0.9rem; display: none; }
        .feedback.correct { background: #dcfce7; color: #15803d; display: block; }
        .feedback.incorrect { background: #fee2e2; color: #b91c1c; display: block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #f8fafc; border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); text-align: center; }
        .stat-card p { font-size: 1.8rem; font-weight: 700; color: var(--primary); }

        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f1f5f9; }
        
        #toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; background: #1e293b; color: white; border-radius: 8px; display: none; z-index: 1000; }

        /* Modal de Detalhes */
        .modal { display: none; position: fixed; z-index: 999; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); overflow: auto; }
        .modal-content { background-color: #fff; margin: 5% auto; padding: 24px; border-radius: var(--radius); max-width: 750px; width: 90%; position: relative; max-height: 85vh; overflow-y: auto; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 1.8rem; cursor: pointer; color: var(--text-muted); }
        .close-btn:hover { color: var(--text); }
        .detail-item { padding: 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 12px; }
        .detail-item.correct-bg { border-left: 5px solid #22c55e; background: #f0fdf4; }
        .detail-item.incorrect-bg { border-left: 5px solid #ef4444; background: #fef2f2; }
        .badge { display: inline-block; padding: 2px 8px; font-size: 0.75rem; font-weight: 700; border-radius: 4px; margin-left: 8px; }
        .badge.correct { background: #dcfce7; color: #15803d; }
        .badge.incorrect { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎯 Plataforma de Simulados Multitópicos</h1>
        <p>Selecione o questionário desejado e acompanhe seu desempenho</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('quiz-tab', this)">📝 Realizar Simulado</button>
        <button class="tab-btn" onclick="switchTab('history-tab', this)">📊 Histórico & Desempenho</button>
    </div>

    <!-- ABA 1: SIMULADO -->
    <div id="quiz-tab" class="tab-content active">
        <div class="card">
            <div style="margin-bottom: 16px;">
                <label><strong>Selecione o Quiz:</strong></label>
                <select id="quizSelector" onchange="changeQuiz()">
                    <option value="">Carregando questionários da planilha...</option>
                </select>
            </div>
            <div style="margin-bottom: 16px;">
                <label><strong>Seu Nome / Identificação:</strong></label>
                <input type="text" id="userName" value="Aluno">
            </div>
            <div id="questionsContainer"></div>
            <button class="btn" onclick="submitQuiz()">Finalizar e Salvar Resultado</button>
        </div>
    </div>

    <!-- ABA 2: HISTÓRICO -->
    <div id="history-tab" class="tab-content">
        <div class="card" style="margin-bottom: 16px;">
            <label><strong>Filtrar Histórico por Quiz:</strong></label>
            <select id="historyFilter" onchange="renderHistoryTable()">
                <option value="ALL">Todos os Quizzes</option>
            </select>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><h3>Total de Testes</h3><p id="statTotalTests">0</p></div>
            <div class="stat-card"><h3>Média Geral</h3><p id="statAvgScore">0%</p></div>
            <div class="stat-card"><h3>Maior Nota</h3><p id="statMaxScore">0%</p></div>
        </div>

        <div class="card">
            <h3>Evolução das Notas (%)</h3>
            <canvas id="performanceChart" height="100"></canvas>
        </div>

        <div class="card">
            <h3>Histórico Detalhado</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr><th>Data/Hora</th><th>Usuário</th><th>Quiz</th><th>Acertos</th><th>Total</th><th>Aproveitamento</th><th>Ações</th></tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr><td colspan="7" style="text-align:center;">Carregando histórico...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE DETALHES -->
<div id="detailsModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h2 id="modalHeaderTitle" style="margin-bottom: 6px;">Análise do Simulado</h2>
        <p id="modalSubTitle" style="color: var(--text-muted); margin-bottom: 20px;"></p>
        <div id="modalDetailsContent"></div>
    </div>
</div>

<div id="toast"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxWQrBMmyC6vrXdjTUv9xTiCCLc2QWeG3JZBiRVuqbBEs6q9fZqrhUV9Nkb4Tmdxr4x/exec";

    let allQuizzes = [];
    let allHistory = [];
    let currentQuiz = null;
    let activeQuestions = [];
    let chartInstance = null;

    document.addEventListener("DOMContentLoaded", () => {
        loadDataFromSheets();
    });

    function shuffleArray(array) {
        const arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function switchTab(tabId, btn) {
        document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
        document.querySelectorAll(".tab-btn").forEach(el => el.classList.remove("active"));
        document.getElementById(tabId).classList.add("active");
        btn.classList.add("active");
    }

    async function loadDataFromSheets() {
        showToast("Carregando dados da planilha...");
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            
            allQuizzes = data.quizzes || [];
            allHistory = data.history || [];

            populateQuizSelectors();
            if (allQuizzes.length > 0) {
                currentQuiz = allQuizzes[0];
                renderQuestions();
            }
            renderHistoryTable();
            showToast("Dados carregados com sucesso!");
        } catch (e) {
            showToast("Erro ao carregar dados do Google Sheets.");
        }
    }

    function populateQuizSelectors() {
        const quizSelector = document.getElementById("quizSelector");
        const historyFilter = document.getElementById("historyFilter");

        quizSelector.innerHTML = allQuizzes.map((q, idx) => `<option value="${idx}">${q.title}</option>`).join('');
        historyFilter.innerHTML = `<option value="ALL">Todos os Quizzes</option>` + 
            allQuizzes.map(q => `<option value="${q.title}">${q.title}</option>`).join('');
    }

    function changeQuiz() {
        const idx = document.getElementById("quizSelector").value;
        if (allQuizzes[idx]) {
            currentQuiz = allQuizzes[idx];
            renderQuestions();
        }
    }

    function renderQuestions() {
        const container = document.getElementById("questionsContainer");
        if (!currentQuiz || !currentQuiz.questions || currentQuiz.questions.length === 0) {
            container.innerHTML = "<p style='padding:15px; text-align:center;'>Nenhuma questão encontrada neste quiz.</p>";
            activeQuestions = [];
            return;
        }

        const shuffledQuestions = shuffleArray(currentQuiz.questions);

        activeQuestions = shuffledQuestions.map(q => {
            const optionsMapped = q.options.map((opt, oIdx) => ({
                text: opt,
                isCorrect: oIdx === q.correct
            }));

            const shuffledOpts = shuffleArray(optionsMapped);
            const newCorrectIdx = shuffledOpts.findIndex(opt => opt.isCorrect);

            return {
                id: q.id,
                question: q.question,
                options: shuffledOpts.map(opt => opt.text),
                correct: newCorrectIdx,
                explanation: q.explanation
            };
        });

        container.innerHTML = activeQuestions.map((q, idx) => `
            <div class="question-card">
                <div class="question-title">${idx + 1}. ${q.question}</div>
                <div class="options-list">
                    ${q.options.map((opt, oIdx) => `
                        <label class="option-item">
                            <input type="radio" name="q_${q.id}" value="${oIdx}"> <span>${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div class="feedback" id="feedback_${q.id}"></div>
            </div>
        `).join('');
    }

    async function submitQuiz() {
        if (!activeQuestions || activeQuestions.length === 0) return;

        let score = 0;
        let detalhes = [];

        activeQuestions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            const fb = document.getElementById(`feedback_${q.id}`);
            const userAnsIdx = selected ? parseInt(selected.value) : -1;
            const isCorrect = userAnsIdx === q.correct;

            if (isCorrect) score++;

            detalhes.push({
                questao: q.question,
                respostaAluno: userAnsIdx >= 0 ? q.options[userAnsIdx] : "Não respondeu",
                respostaCorreta: q.options[q.correct] || "",
                ehCorreto: isCorrect,
                explicacao: q.explanation || ""
            });

            if (isCorrect) {
                fb.className = "feedback correct";
                fb.innerHTML = `<strong>Correto!</strong> ${q.explanation}`;
            } else {
                fb.className = "feedback incorrect";
                fb.innerHTML = `<strong>Incorreto.</strong> Resposta correta: ${q.options[q.correct] || ''}. ${q.explanation}`;
            }
        });

        const percentage = Math.round((score / activeQuestions.length) * 100);
        const record = {
            data: new Date().toLocaleString("pt-BR"),
            usuario: document.getElementById("userName").value.trim() || "Anônimo",
            quiz: currentQuiz.title,
            acertos: score,
            total: activeQuestions.length,
            porcentagem: percentage,
            detalhes: detalhes
        };

        showToast("Enviando resultado...");
        
        allHistory.push(record);
        renderHistoryTable();

        try {
            await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(record)
            });
            showToast("Resultado salvo na planilha!");
        } catch (e) {
            showToast("Erro ao salvar resultado.");
        }
    }

    function renderHistoryTable() {
        const filterVal = document.getElementById("historyFilter").value;
        const tbody = document.getElementById("historyTableBody");

        let filteredHistory = allHistory;
        if (filterVal !== "ALL") {
            filteredHistory = allHistory.filter(h => h.quiz === filterVal);
        }

        if (filteredHistory.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Nenhum teste registrado para essa seleção.</td></tr>`;
            updateDashboard([]);
            return;
        }

        const reversedFiltered = filteredHistory.slice().reverse();

        tbody.innerHTML = reversedFiltered.map((row) => {
            const realIndex = allHistory.indexOf(row);
            return `
            <tr>
                <td>${row.data}</td>
                <td>${row.usuario}</td>
                <td><strong>${row.quiz}</strong></td>
                <td>${row.acertos}</td>
                <td>${row.total}</td>
                <td><strong>${row.porcentagem}%</strong></td>
                <td>
                    <button class="btn-sm" onclick="openDetails(${realIndex})">🔍 Ver Respostas</button>
                </td>
            </tr>
        `}).join('');

        updateDashboard(filteredHistory);
    }

    function openDetails(historyIndex) {
        const record = allHistory[historyIndex];
        if (!record) return;

        document.getElementById("modalHeaderTitle").innerText = `Desempenho: ${record.usuario}`;
        document.getElementById("modalSubTitle").innerText = `Quiz: ${record.quiz} | Data: ${record.data} | Resultado: ${record.acertos}/${record.total} (${record.porcentagem}%)`;

        const detailsContainer = document.getElementById("modalDetailsContent");

        if (!record.detalhes || record.detalhes.length === 0) {
            detailsContainer.innerHTML = "<p style='text-align:center; padding: 20px;'>Não há detalhes gravados para este registro antigo.</p>";
        } else {
            detailsContainer.innerHTML = record.detalhes.map((item, idx) => `
                <div class="detail-item ${item.ehCorreto ? 'correct-bg' : 'incorrect-bg'}">
                    <p style="font-weight:600; margin-bottom: 6px;">
                        ${idx + 1}. ${item.questao}
                        <span class="badge ${item.ehCorreto ? 'correct' : 'incorrect'}">
                            ${item.ehCorreto ? 'ACERTOU' : 'ERROU'}
                        </span>
                    </p>
                    <p style="font-size:0.95rem; margin-bottom: 4px;">
                        <strong>Resposta do Aluno:</strong> ${item.respostaAluno}
                    </p>
                    ${!item.ehCorreto ? `<p style="font-size:0.95rem; color:#b91c1c; margin-bottom: 4px;"><strong>Resposta Correta:</strong> ${item.respostaCorreta}</p>` : ''}
                    ${item.explicacao ? `<p style="font-size:0.85rem; color:var(--text-muted); margin-top:6px;"><em>Explicação: ${item.explicacao}</em></p>` : ''}
                </div>
            `).join('');
        }

        document.getElementById("detailsModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("detailsModal").style.display = "none";
    }

    window.onclick = function(event) {
        const modal = document.getElementById("detailsModal");
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }

    function updateDashboard(data) {
        if (data.length === 0) {
            document.getElementById("statTotalTests").innerText = "0";
            document.getElementById("statAvgScore").innerText = "0%";
            document.getElementById("statMaxScore").innerText = "0%";
            if (chartInstance) chartInstance.destroy();
            return;
        }

        document.getElementById("statTotalTests").innerText = data.length;
        const avg = Math.round(data.reduce((acc, c) => acc + parseInt(c.porcentagem), 0) / data.length);
        document.getElementById("statAvgScore").innerText = `${avg}%`;
        document.getElementById("statMaxScore").innerText = `${Math.max(...data.map(d => parseInt(d.porcentagem)))}%`;

        const ctx = document.getElementById('performanceChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => d.data ? d.data.split(",")[0] : ""),
                datasets: [{ label: 'Aproveitamento (%)', data: data.map(d => parseInt(d.porcentagem)), borderColor: '#2563eb', fill: true, backgroundColor: 'rgba(37,99,235,0.1)' }]
            },
            options: { scales: { y: { min: 0, max: 100 } } }
        });
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.innerText = msg; t.style.display = "block";
        setTimeout(() => t.style.display = "none", 3000);
    }
</script>
</body>
</html>
